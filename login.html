<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | همایش فناوری و نوآوری ۱۴۰۵</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="logo"><div class="logo-icon">هـ</div><span>همایش فناوری ۱۴۰۵</span></a>
        <div class="nav-actions">
          <a href="register.html" class="btn btn-primary btn-sm">ثبت‌نام</a>
        </div>
      </nav>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>ورود به پنل</h2>
        <p>به حساب کاربری خود وارد شوید</p>
      </div>
      <div class="auth-body">
        <form onsubmit="event.preventDefault(); loginDemo(document.getElementById('email').value, document.getElementById('role').value);">
          <div class="form-group">
            <label class="form-label">ایمیل</label>
            <input type="email" id="email" class="form-control" required placeholder="example@email.com" value="user@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">رمز عبور</label>
            <input type="password" class="form-control" required placeholder="رمز عبور" value="12345678">
          </div>
          <div class="form-group">
            <label class="form-label">نقش (برای دمو)</label>
            <select id="role" class="form-control">
              <option value="user">شرکت‌کننده / نویسنده</option>
              <option value="reviewer">داور</option>
              <option value="admin">مدیر سیستم</option>
            </select>
          </div>
          <div class="form-check" style="margin-bottom:20px;">
            <input type="checkbox" id="remember">
            <label for="remember">مرا به خاطر بسپار</label>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">ورود</button>
        </form>
        <div style="text-align:center;margin-top:15px;">
          <a href="#" style="color:var(--primary);font-size:0.9rem;">رمز عبور را فراموش کرده‌اید؟</a>
        </div>
      </div>
      <div class="auth-footer">
        حساب کاربری ندارید؟ <a href="register.html">ثبت‌نام کنید</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
