name: PHP syntax
on:
  push:
    branches: [main, feature/wordpress-production-foundation]
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint WordPress PHP files
        shell: bash
        run: |
          set -euo pipefail
          find wordpress -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file"
          done
